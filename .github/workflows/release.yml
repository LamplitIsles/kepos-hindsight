name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: npm install --global npm@">=11.10.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:sync-version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm release:check
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - run: pnpm pack-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: verified-kepos-hindsight
          path: |
            dist
            package.json
            cordis.patch.yml
            README.md
            LICENSE

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@">=11.10.0"
      - uses: actions/download-artifact@v4
        with:
          name: verified-kepos-hindsight
          path: package
      - name: Publish verified package
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish "./package" --access public --provenance --tag beta
          else
            npm publish "./package" --access public --provenance --tag latest
          fi
